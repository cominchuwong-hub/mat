<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Game Pro</title>

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#6a11cb,#2575fc,#00d4ff);
    overflow:hidden;
}

/* BACKGROUND */
.bg-glow{
    position:absolute;
    width:300px;
    height:300px;
    border-radius:50%;
    filter:blur(120px);
    opacity:0.5;
}

.glow1{background:#ff00ff;top:-120px;left:-120px;}
.glow2{background:#00ffff;bottom:-120px;right:-120px;}

.bg-item{
    position:absolute;
    font-size:60px;
    color:rgba(255,255,255,0.08);
    animation:float 6s ease-in-out infinite;
    pointer-events:none;
}

@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-25px);}
}

/* STATS */
.stats-bar{
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:12px;
    background:rgba(0,0,0,0.35);
    backdrop-filter:blur(10px);
    padding:10px 15px;
    border-radius:15px;
    color:white;
    font-size:13px;
}

.stat{
    background:rgba(255,255,255,0.1);
    padding:5px 8px;
    border-radius:8px;
}

/* GAME BOX FULL */
.game-box{
    width:100%;
    max-width:900px;
    height:90vh;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    padding:30px;
    border-radius:25px;

    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(12px);
    box-shadow:0 10px 40px rgba(0,0,0,0.4);

    color:white;
}

h1{margin-bottom:10px;}

.score{margin-bottom:10px;}

.status{
    display:flex;
    justify-content:space-between;
    width:100%;
    max-width:400px;
    margin-bottom:10px;
}

#hearts{color:#ff4d6d;}
#timer{color:#00ffcc;}

#question{
    font-size:40px;
    margin:25px 0;
}

input{
    width:100%;
    max-width:400px;
    padding:15px;
    border:none;
    border-radius:15px;
    text-align:center;
    font-size:20px;
}

button{
    width:100%;
    max-width:400px;
    margin-top:15px;
    padding:15px;
    font-size:18px;
    font-weight:bold;
    border:none;
    border-radius:15px;
    cursor:pointer;
    background:linear-gradient(45deg,#00d4ff,#7b2ff7);
    color:white;
}

.result{
    margin-top:15px;
    min-height:25px;
}

/* ===== FANCY RESULT MODAL ===== */
.modal{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;

    display:none;
    justify-content:center;
    align-items:center;

    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(8px);
}

.modal-box{
    width:320px;
    padding:25px;

    border-radius:25px;

    background:linear-gradient(
        135deg,
        rgba(255,255,255,0.25),
        rgba(255,255,255,0.10)
    );

    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.2);

    box-shadow:0 10px 40px rgba(0,0,0,0.5);

    color:white;
    text-align:center;

    animation:pop 0.4s ease;
}

@keyframes pop{
    from{transform:scale(0.7);opacity:0;}
    to{transform:scale(1);opacity:1;}
}

.modal-box h2{
    margin-bottom:15px;
}

.stat-row{
    display:flex;
    justify-content:space-between;
    margin:8px 0;
    padding:8px 12px;

    background:rgba(255,255,255,0.08);
    border-radius:12px;
}

.stat-row span:last-child{
    color:#00ffcc;
    font-weight:bold;
}

.modal-box button{
    margin-top:15px;
    width:100%;
    padding:12px;

    border:none;
    border-radius:15px;

    background:linear-gradient(45deg,#00d4ff,#7b2ff7);
    color:white;

    font-weight:bold;
    cursor:pointer;
}

</style>
</head>

<body>

<!-- background -->
<div class="bg-glow glow1"></div>
<div class="bg-glow glow2"></div>

<div class="bg-item">➕</div>
<div class="bg-item">➖</div>
<div class="bg-item">✖️</div>
<div class="bg-item">➗</div>

<!-- stats -->
<div class="stats-bar">
<div class="stat">🎮 <span id="played">0</span></div>
<div class="stat">✅ <span id="correctCount">0</span></div>
<div class="stat">❌ <span id="wrongCount">0</span></div>
<div class="stat">🎯 <span id="accuracy">0</span>%</div>
</div>

<!-- game -->
<div class="game-box">

    <h1>🧠 Math Game Pro</h1>

    <div class="score">คะแนน: <span id="score">0</span></div>

    <div class="status">
        <div>❤️ <span id="hearts">❤️❤️❤️❤️❤️</span></div>
        <div>⏱️ <span id="timer">60</span></div>
    </div>

    <div id="question"></div>

    <input type="number" id="answer" placeholder="ใส่คำตอบ">

    <button onclick="checkAnswer()">ตอบคำถาม</button>

    <div class="result" id="result"></div>

</div>

<!-- modal -->
<div class="modal" id="modal">
    <div class="modal-box">

        <h2>🏁 จบเกม</h2>

        <div class="stat-row">
            <span>คะแนน</span>
            <span id="finalScore">0</span>
        </div>

        <div class="stat-row">
            <span>เล่นทั้งหมด</span>
            <span id="finalPlayed">0</span>
        </div>

        <div class="stat-row">
            <span>ตอบถูก</span>
            <span id="finalCorrect">0</span>
        </div>

        <div class="stat-row">
            <span>ตอบผิด</span>
            <span id="finalWrong">0</span>
        </div>

        <div class="stat-row">
            <span>ความแม่นยำ</span>
            <span id="finalAcc">0%</span>
        </div>

        <button onclick="location.reload()">🔁 เล่นใหม่</button>

    </div>
</div>

<script>

let score = 0;
let lives = 5;
let time = 60;
let correct = 0;

let played = 0;
let correctCount = 0;
let wrongCount = 0;

function updateStats(){
    let acc = played ? Math.round((correctCount/played)*100) : 0;

    document.getElementById("played").innerText = played;
    document.getElementById("correctCount").innerText = correctCount;
    document.getElementById("wrongCount").innerText = wrongCount;
    document.getElementById("accuracy").innerText = acc;
}

function updateHearts(){
    document.getElementById("hearts").innerText = "❤️".repeat(lives);
}

function generateQuestion(){

    let a = Math.floor(Math.random()*20)+1;
    let b = Math.floor(Math.random()*20)+1;

    correct = a + b;

    document.getElementById("question").innerText = `${a} + ${b} = ?`;
}

function checkAnswer(){

    if(time <= 0 || lives <= 0) return;

    let ans = Number(document.getElementById("answer").value);

    played++;

    if(ans === correct){

        score++;
        correctCount++;

        document.getElementById("result").innerText = "✅ ถูกต้อง!";
        document.getElementById("result").style.color = "#7CFC00";

    }else{

        lives--;
        wrongCount++;

        updateHearts();

        document.getElementById("result").innerText =
        `❌ ผิด! คำตอบคือ ${correct}`;
        document.getElementById("result").style.color = "#ff8080";
    }

    document.getElementById("score").innerText = score;
    document.getElementById("answer").value = "";

    updateStats();
    generateQuestion();

    if(lives <= 0 || time <= 0){
        gameOver();
    }
}

function gameOver(){

    let acc = played ? Math.round((correctCount/played)*100) : 0;

    document.getElementById("finalScore").innerText = score;
    document.getElementById("finalPlayed").innerText = played;
    document.getElementById("finalCorrect").innerText = correctCount;
    document.getElementById("finalWrong").innerText = wrongCount;
    document.getElementById("finalAcc").innerText = acc;

    document.getElementById("modal").style.display = "flex";
}

setInterval(()=>{

    if(time <= 0) return;

    time--;
    document.getElementById("timer").innerText = time;

    if(time <= 0){
        gameOver();
    }

},1000);

updateHearts();
updateStats();
generateQuestion();

</script>

</body>
</html>
