<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Challenge PRO</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Arial';
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#1e3c72,#2a5298,#000428);
    overflow:hidden;
    color:white;
}

/* glow */
.glow{
    position:absolute;
    width:300px;
    height:300px;
    border-radius:50%;
    filter:blur(120px);
    opacity:0.5;
}
.glow1{background:#ff00ff;top:-120px;left:-120px;}
.glow2{background:#00ffff;bottom:-120px;right:-120px;}

/* floating */
.bg-item{
    position:absolute;
    font-size:60px;
    color:rgba(255,255,255,0.08);
    animation:float 6s ease-in-out infinite;
}
@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-25px);}
}
.bg-item:nth-child(1){top:10%;left:10%;}
.bg-item:nth-child(2){top:20%;right:10%;}
.bg-item:nth-child(3){bottom:15%;left:15%;}
.bg-item:nth-child(4){bottom:20%;right:20%;}

/* stats */
.stats-bar{
    position:absolute;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:10px;
    background:rgba(0,0,0,0.35);
    padding:10px 15px;
    border-radius:15px;
    font-size:13px;
    backdrop-filter:blur(10px);
}

/* game box */
.game-box{
    width:100%;
    max-width:900px;
    height:90vh;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    padding:40px 20px;

    border-radius:25px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(12px);
    box-shadow:0 10px 40px rgba(0,0,0,0.4);
}

/* text */
h1{margin-bottom:10px;}

.mode{
    color:#ffe600;
    margin-bottom:10px;
    font-weight:bold;
}

.score{margin-bottom:10px;}

.status{
    display:flex;
    justify-content:space-between;
    width:100%;
    max-width:400px;
    margin-bottom:10px;
}

#hearts{color:#ff4d6d;}
#timer{color:#00ffcc;}

#question{
    font-size:38px;
    margin:25px 0;
    text-align:center;
}

input{
    width:100%;
    max-width:400px;
    padding:15px;
    border:none;
    border-radius:15px;
    text-align:center;
    font-size:18px;
}

button{
    width:100%;
    max-width:400px;
    margin-top:15px;
    padding:15px;
    border:none;
    border-radius:15px;
    background:linear-gradient(45deg,#00d4ff,#7b2ff7);
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.result{
    margin-top:15px;
    min-height:25px;
}

/* popup */
.modal{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    display:none;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(10px);
}

.modal-box{
    width:340px;
    padding:25px;
    border-radius:25px;

    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,0.2);

    text-align:center;
}

.stat-line{
    display:flex;
    justify-content:space-between;
    margin:8px 0;
    padding:8px;
    background:rgba(255,255,255,0.08);
    border-radius:10px;
}

.modal-box button{
    margin-top:15px;
    width:100%;
    padding:12px;
    border-radius:15px;
    border:none;
    background:linear-gradient(45deg,#00d4ff,#7b2ff7);
    color:white;
    font-weight:bold;
}

</style>
</head>

<body>

<!-- background -->
<div class="glow glow1"></div>
<div class="glow glow2"></div>

<div class="bg-item">➕</div>
<div class="bg-item">➖</div>
<div class="bg-item">✖️</div>
<div class="bg-item">➗</div>

<!-- stats -->
<div class="stats-bar">
🎮 <span id="played">0</span> |
✅ <span id="correctC">0</span> |
❌ <span id="wrongC">0</span> |
🎯 <span id="acc">0</span>%
</div>

<!-- game -->
<div class="game-box">

    <h1>🧠 Math Challenge PRO</h1>

    <div class="mode">ระดับ: มัธยมปลาย (โหมดโหด)</div>

    <div class="score">
        คะแนน: <span id="score">0</span>
    </div>

    <div class="status">
        <div>❤️ <span id="hearts">❤️❤️❤️❤️❤️</span></div>
        <div>⏱️ <span id="timer">60</span></div>
    </div>

    <div id="question">---</div>

    <input type="number" id="answer" placeholder="ใส่คำตอบ">

    <button onclick="checkAnswer()">ตอบคำถาม</button>
    <button onclick="resetGame()">🔄 เริ่มใหม่</button>

    <div class="result" id="result"></div>

</div>

<!-- popup -->
<div class="modal" id="modal">
    <div class="modal-box">

        <h2>🏁 จบเกม</h2>

        <div class="stat-line">คะแนน <span id="finalScore"></span></div>
        <div class="stat-line">เล่น <span id="finalPlayed"></span></div>
        <div class="stat-line">ถูก <span id="finalCorrect"></span></div>
        <div class="stat-line">ผิด <span id="finalWrong"></span></div>
        <div class="stat-line">แม่นยำ <span id="finalAcc"></span>%</div>

        <button onclick="location.reload()">🔁 เล่นใหม่</button>

    </div>
</div>

<script>

let score = 0;
let lives = 5;
let time = 60;
let correct = 0;

let played = 0;
let correctC = 0;
let wrongC = 0;

function updateStats(){
    let acc = played ? Math.round((correctC/played)*100) : 0;
    document.getElementById("played").innerText = played;
    document.getElementById("correctC").innerText = correctC;
    document.getElementById("wrongC").innerText = wrongC;
    document.getElementById("acc").innerText = acc;
}

function updateHearts(){
    document.getElementById("hearts").innerText = "❤️".repeat(lives);
}

/* 🔥 HARD QUESTIONS */
function generateQuestion(){

    let type = Math.floor(Math.random()*6);

    let a = Math.floor(Math.random()*30)+1;
    let b = Math.floor(Math.random()*30)+1;
    let c = Math.floor(Math.random()*10)+1;

    let q = "";

    switch(type){

        case 0:
            correct = a*b + c;
            q = `${a} × ${b} + ${c} = ?`;
            break;

        case 1:
            correct = (a+b)*c;
            q = `(${a} + ${b}) × ${c} = ?`;
            break;

        case 2:
            correct = a*b - c;
            q = `${a} × ${b} - ${c} = ?`;
            break;

        case 3:
            let x = Math.floor(Math.random()*15)+1;
            correct = x*x;
            q = `${x}² = ?`;
            break;

        case 4:
            let m = Math.floor(Math.random()*10)+1;
            let n = Math.floor(Math.random()*10)+1;
            correct = m;
            q = `${m*n} ÷ ${n} = ?`;
            break;

        case 5:
            let base = Math.floor(Math.random()*20)+1;
            let add = Math.floor(Math.random()*20)+1;
            correct = base;
            q = `x + ${add} = ${base+add} (x = ?)`;
            break;
    }

    document.getElementById("question").innerText = q;
}

/* check */
function checkAnswer(){

    if(time<=0 || lives<=0) return;

    let ans = Number(document.getElementById("answer").value);

    played++;

    if(ans === correct){
        score++;
        correctC++;
        document.getElementById("result").innerText = "✅ ถูกต้อง!";
    }else{
        lives--;
        wrongC++;
        updateHearts();

        document.getElementById("result").innerText =
        `❌ ผิด! คำตอบคือ ${correct}`;

        if(lives<=0){
            gameOver();
            return;
        }
    }

    document.getElementById("score").innerText = score;
    document.getElementById("answer").value = "";

    updateStats();
    generateQuestion();
}

function resetGame(){
    score = 0;
    lives = 5;
    time = 60;
    correct = 0;
    played = 0;
    correctC = 0;
    wrongC = 0;

    document.getElementById("result").innerText = "";
    document.getElementById("answer").value = "";
    document.getElementById("modal").style.display = "none";
    document.getElementById("timer").innerText = time;
    document.getElementById("score").innerText = score;

    updateHearts();
    updateStats();
    generateQuestion();
}

/* game over */
function gameOver(){

    let acc = played ? Math.round((correctC/played)*100) : 0;

    document.getElementById("finalScore").innerText = score;
    document.getElementById("finalPlayed").innerText = played;
    document.getElementById("finalCorrect").innerText = correctC;
    document.getElementById("finalWrong").innerText = wrongC;
    document.getElementById("finalAcc").innerText = acc;

    document.getElementById("modal").style.display = "flex";
}

/* timer */
setInterval(()=>{
    if(time<=0) return;

    time--;
    document.getElementById("timer").innerText = time;

    if(time<=0) gameOver();

},1000);

updateHearts();
updateStats();
generateQuestion();

</script>

</body>
</html>
